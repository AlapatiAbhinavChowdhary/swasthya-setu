[project]
name = "swasthya-setu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlapatiAbhinavChowdhary", email = "abhinavalapati.aac@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.34.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
]

[project.scripts]
swasthya-setu = "swasthya_setu:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"